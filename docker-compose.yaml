version: '3.8'

services:
  database:
    container_name: vacations-database
    ports:
      - 3306:3306
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=1
      - MYSQL_DATABASE=twitter
      - MYSQL_TCP_PORT=3306
    build: ./database
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
  backend:
    container_name: vacations-backend
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=compose
    build: ./backend
    depends_on:
      database:
        condition: service_healthy
  frontend:
    container_name: vacations-frontend
    ports:
      - 5173:80
    build: ./frontend
  io:
    container_name: vacations-io
    ports:
      - 3003:3003
    build: ./io
  localstack:
    container_name: vacations-localstack
    ports:
      - 127.0.0.1:4566:4566
      - 127.0.0.1:4510-4559:4510-4559
    volumes:
      - ./.localstack/init-data:/init-data
      - ./.localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh
    image: localstack/localstack
    entrypoint: ["/bin/sh", "-c", "chmod +x /etc/localstack/init/ready.d/init-s3.sh && exec docker-entrypoint.sh"]